<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Outer hexagonal frame rings -->
  <polygon points="100,6 175,48 175,152 100,194 25,152 25,48" stroke="#00ECD6" stroke-width="1.5" fill="none" opacity="0.35"/>
  <polygon points="100,16 165,54 165,146 100,184 35,146 35,54" stroke="#00ECD6" stroke-width="0.8" fill="none" opacity="0.2"/>

  <!-- Circuit tick marks on outer hex -->
  <line x1="100" y1="6" x2="100" y2="16" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>
  <line x1="175" y1="48" x2="165" y2="54" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>
  <line x1="175" y1="152" x2="165" y2="146" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="194" x2="100" y2="184" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="152" x2="35" y2="146" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>
  <line x1="25" y1="48" x2="35" y2="54" stroke="#00ECD6" stroke-width="1.5" opacity="0.6"/>

  <!-- Mid orbital ring -->
  <circle cx="100" cy="100" r="52" stroke="#00ECD6" stroke-width="1" fill="none" opacity="0.25" stroke-dasharray="4 6"/>
  <circle cx="100" cy="100" r="40" stroke="#00ECD6" stroke-width="0.7" fill="none" opacity="0.2" stroke-dasharray="2 8"/>

  <!-- Six node connectors to inner ring -->
  <line x1="100" y1="48" x2="100" y2="60" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="74" x2="135" y2="80" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="145" y1="126" x2="135" y2="120" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="152" x2="100" y2="140" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="126" x2="65" y2="120" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="74" x2="65" y2="80" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>

  <!-- Six corner nodes on outer hex -->
  <circle cx="100" cy="48" r="2.5" fill="#00ECD6" opacity="0.7"/>
  <circle cx="145" cy="74" r="2.5" fill="#00ECD6" opacity="0.7"/>
  <circle cx="145" cy="126" r="2.5" fill="#00ECD6" opacity="0.7"/>
  <circle cx="100" cy="152" r="2.5" fill="#00ECD6" opacity="0.7"/>
  <circle cx="55" cy="126" r="2.5" fill="#00ECD6" opacity="0.7"/>
  <circle cx="55" cy="74" r="2.5" fill="#00ECD6" opacity="0.7"/>

  <!-- Inner geometric eye shape -->
  <ellipse cx="100" cy="100" rx="22" ry="14" stroke="#00ECD6" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Iris -->
  <circle cx="100" cy="100" r="9" stroke="#00ECD6" stroke-width="1.2" fill="rgba(0,236,214,0.08)" opacity="0.95"/>
  <!-- Pupil / core node -->
  <circle cx="100" cy="100" r="4" fill="#00ECD6" opacity="1"/>
  <!-- Pupil glow dot -->
  <circle cx="100" cy="100" r="2" fill="white" opacity="0.8"/>

  <!-- Eye lash lines -->
  <line x1="78" y1="100" x2="68" y2="100" stroke="#00ECD6" stroke-width="1" opacity="0.6"/>
  <line x1="122" y1="100" x2="132" y2="100" stroke="#00ECD6" stroke-width="1" opacity="0.6"/>
  <line x1="100" y1="86" x2="100" y2="78" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="114" x2="100" y2="122" stroke="#00ECD6" stroke-width="1" opacity="0.5"/>

  <!-- Diagonal circuit traces -->
  <line x1="85" y1="88" x2="74" y2="77" stroke="#00ECD6" stroke-width="0.8" opacity="0.35"/>
  <line x1="115" y1="88" x2="126" y2="77" stroke="#00ECD6" stroke-width="0.8" opacity="0.35"/>
  <line x1="85" y1="112" x2="74" y2="123" stroke="#00ECD6" stroke-width="0.8" opacity="0.35"/>
  <line x1="115" y1="112" x2="126" y2="123" stroke="#00ECD6" stroke-width="0.8" opacity="0.35"/>

  <!-- Small data nodes on traces -->
  <rect x="71" y="74" width="5" height="5" rx="1" fill="#00ECD6" opacity="0.5"/>
  <rect x="124" y="74" width="5" height="5" rx="1" fill="#00ECD6" opacity="0.5"/>
  <rect x="71" y="121" width="5" height="5" rx="1" fill="#00ECD6" opacity="0.5"/>
  <rect x="124" y="121" width="5" height="5" rx="1" fill="#00ECD6" opacity="0.5"/>
</svg>
